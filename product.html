<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>

    <link rel="stylesheet" href="./css/Product.css">
    <link rel="stylesheet" href="./css/nav.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="icon" href="favicon.png">
</head>
<body>

<div id="nav"></div>

<main class="product-page">

    <div class="product-container">

        <div class="product-image">

            <img id="productImage" src="./images/laptop.jpg" alt="Product">
            

        </div>

        <div class="product-info">

            <span class="category" id="productCategory">Electronics</span>
           <div class="productinf">
            <h1 id="productTitle">Gaming Laptop</h1>

            <h2 id="productPrice">$850</h2>

            <p id="productDescription">
                High-performance gaming laptop with RTX graphics card,
                Intel i7 processor, 16GB RAM and 512GB SSD.
            </p>
           </div>
            <div class="details">

                <p><strong>Condition:</strong> <span id="productCondition">Used</span></p>

                <p><strong>Location:</strong> <span id="productLocation">Rabat</span></p>

            </div>

            <div class="seller-card">

                <h3>Seller Information</h3>

                <p><strong>Name:</strong> <span id="sellerName">John Doe</span></p>

                <p><strong>Phone:</strong> <span id="sellerPhone">0612345678</span></p>

                <button id="contactBtn">💬 Contact seller</button>
                <button id="saveBtn">❤️ Save product</button>

            </div>

           

        </div>

    </div>

</main>
<script  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="js/supabase.js"></script>
<script type="module" src="./js/main.js"></script>
<script type="module" src="./js/product.js"></script>
<script type="module" src="js/components/notification.js"></script>
</body>
</html>
