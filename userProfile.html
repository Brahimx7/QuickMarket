<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="./css/nav.css">
     <link rel="stylesheet" href="./css/userProfile.css">
</head>

<body>
    <div id="nav"></div>

<div class="profile-container">

                <div class="profile-menu">

                       <button id="aboutBtn" >👤 About Me</button>

                      <button id="favoritesBtn">❤️ Favorites</button>

                      <button id="messagesBtn">💬 Messages</button>

                 </div>

    <div id="aboutSection">

                  <div class="profile-header">

                      <div class="avatar">
                            👤
                       </div>

                        <div class="profile-info">
            
                                <h1 id="profileUsername">Ahmed Chakir</h1>
 
                                <div class="info-box">
                                    <h3>Email</h3>
                                   <p id="profilemail">ahmed@gmail.com</p>
                                </div>

                                 <div class="info-box">
                                     <h3>Products Posted</h3>
                                     <p><span id="profileproducts">0</span></p>
                                     <h3>Date Joined :</h3>
                                     <p><span id="profilejoined">0</span></p>
                                 </div>

                          </div>

                      </div>

                 <h2>Your Products</h2>

              <div id="userproducts" class="userproducts"></div>
         
    </div>
         
         <div id="favoritesSection" class="hidden">


         </div>

       
              <div id="messagesSection" class="hidden">
                 
                        <div id="conversationList"></div>

                    <div id="chatArea" class="hidden chatphone">

                              <div id="messagesContainer"></div>

                        <div class="typesendmessages">
                             <input
                                 type="text"
                                 id="messageInput"
                                     placeholder="Type your message..."
                                            class="hidden">

                             <button id="sendBtn" class="hidden">Send</button>
                         </div>

                    </div>

              </div>
            
            
              
</div>

<div id="deleteModal" class="hidden">
   
        <h2 id="deleteTitle">delete product</h2>

        

        <button id="cancelDelete">Cancel</button>
        <button id="confirmDelete">Delete</button>
   
</div>


<script  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module" src="js/supabase.js"></script>
<script type="module" src="./js/main.js"></script>
<script type="module" src="./js/userProfile.js"></script>
</body>

</html>
